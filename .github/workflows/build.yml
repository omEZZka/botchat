name: Build botCHAT

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Verify web assets
        run: |
          for f in app/src/main/assets/ui/js/*.js; do node --check "$f"; done
          bash -n scripts/build-runtime.sh

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.BOTCHAT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BOTCHAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOTCHAT_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOTCHAT_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.p12
            {
              echo "storeFile=release.p12"
              echo "storePassword=${KS_PASS}"
              echo "keyAlias=${KEY_ALIAS:-botchat}"
              echo "keyPassword=${KEY_PASS}"
            } > keystore.properties
          else
            echo "Keystore secret missing: release build will be unsigned" >&2
          fi

      - name: Compute build number
        id: version
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${{ steps.version.outputs.name }}\"/" app/build.gradle.kts

      - name: Build release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Locate APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "APK not found" >&2; exit 1; fi
          OUT="botCHAT-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          unzip -l "$OUT" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: botchat-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: botCHAT build-${{ github.run_number }}
          body: |
            Сборка ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true

      - name: Publish runtime artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/runtime/*.tar.gz
          fail_on_unmatched_files: false
